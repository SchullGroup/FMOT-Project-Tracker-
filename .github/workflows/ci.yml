# Lint, unit tests and the web walkthroughs on every push; on main, after they pass, deploy to staging (Fly.io,
# Frankfurt). The staging API's migrations run as their own step (Fly's release command) before the new API starts.
# Setup and secrets: docs/operations.md.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PNPM_VERSION: 12.11.2

jobs:
  checks:
    name: Lint, unit tests, types
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fmot/shared build
      - name: Lint the API
        run: pnpm --filter api lint
      - name: API unit tests
        run: pnpm --filter api test
      - name: Typecheck the web app
        run: pnpm --filter web typecheck
      - name: OpenAPI document and shared types are up to date
        # The generator builds the module graph only (no database); config validation still wants well-formed values.
        run: |
          export DATABASE_URL=postgresql://ci:ci@localhost:5432/ci DATABASE_URL_UNPOOLED=postgresql://ci:ci@localhost:5432/ci
          export JWT_ACCESS_SECRET=$(node -e "console.log(require('crypto').randomBytes(64).toString('base64url'))")
          export JWT_REFRESH_SECRET=$(node -e "console.log(require('crypto').randomBytes(64).toString('base64url'))")
          export MEDIA_SIGNING_SECRET=$(node -e "console.log(require('crypto').randomBytes(64).toString('base64url'))")
          pnpm api:types
          git diff --exit-code -- packages/shared/openapi.json packages/shared/src/api-types.ts \
            || (echo "::error::Run pnpm api:types and commit the result" && exit 1)

  web:
    name: Web walkthroughs (Playwright, sample data)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fmot/shared build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Walkthroughs
        run: pnpm --filter web test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  deploy-staging:
    name: Deploy to staging
    needs: [checks, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: staging
      url: https://fmot-web-staging.fly.dev
    # One deploy at a time; a newer push waits rather than cancelling one half done.
    concurrency:
      group: staging
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Pin to a commit SHA once the repository is on GitHub.
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy the API (migrations first, as the release command)
        run: flyctl deploy --config deploy/fly/api.staging.toml --dockerfile apps/api/Dockerfile --remote-only --image-label "git-${GITHUB_SHA::12}" .
      - name: Deploy the web app
        run: flyctl deploy --config deploy/fly/web.staging.toml --dockerfile apps/web/Dockerfile --remote-only --image-label "git-${GITHUB_SHA::12}" .
      - name: Smoke check
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-all-errors https://fmot-api-staging.fly.dev/api/ready
          curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-all-errors -o /dev/null https://fmot-web-staging.fly.dev/sign-in
