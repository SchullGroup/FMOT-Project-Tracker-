# Types, the field app's unit tests and the web walkthroughs on every push; on main, after they pass, deploy the web
# app to staging (Fly.io, Frankfurt). The API is in SchullGroup/FMOT-Project-Tracker-API and deploys from there.
# Setup and secrets: docs/operations.md.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PNPM_VERSION: 12.11.2

jobs:
  checks:
    name: Types and field app unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fmot/shared build
      - name: Typecheck the web app
        run: pnpm --filter web typecheck
      - name: Typecheck the field app
        run: pnpm --filter mobile typecheck
      - name: Field app unit tests
        run: pnpm --filter mobile test

  web:
    name: Web walkthroughs (Playwright, sample data)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fmot/shared build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Walkthroughs
        run: pnpm --filter web test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  deploy-staging:
    name: Deploy to staging
    needs: [checks, web]
    # Off until staging exists on Fly.io: set the repository variable STAGING_DEPLOY to on (Settings, Secrets and
    # variables, Actions, Variables) together with the FLY_API_TOKEN secret (docs/operations.md, One-time setup).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_DEPLOY == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: staging
      url: https://fmot-web-staging.fly.dev
    # One deploy at a time; a newer push waits rather than cancelling one half done.
    concurrency:
      group: staging
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Pin to a commit SHA once the repository is on GitHub.
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy the web app
        run: flyctl deploy --config deploy/fly/web.staging.toml --dockerfile apps/web/Dockerfile --remote-only --image-label "git-${GITHUB_SHA::12}" .
      - name: Smoke check
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-all-errors -o /dev/null https://fmot-web-staging.fly.dev/sign-in
