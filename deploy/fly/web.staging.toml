# Staging web app on Fly.io, Frankfurt (fra). See docs/operations.md.
# Deploy from the repository root:
#   flyctl deploy --config deploy/fly/web.staging.toml --dockerfile apps/web/Dockerfile .
app = "fmot-web-staging"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = 15

[build.args]
  # /api is forwarded to the staging API over Fly's private network (fixed at build time by Next.js).
  API_ORIGIN = "http://fmot-api-staging.internal:4000"
  NEXT_PUBLIC_MAP_STYLE_URL = "https://tiles.openfreemap.org/styles/liberty"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/sign-in"
    interval = "15s"
    timeout = "3s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
